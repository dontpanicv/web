# Serve separate static roots per host so preview can diverge from production.

server {
    listen 80;
    server_name dontpanicv.com;

    root /usr/share/nginx/html/main;
    index index.html;

    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self';" always;

    autoindex off;

    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Root: serve the site entrypoint
    location = / {
        try_files /index.html =404;
    }

    # Other static files / folders
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name preview.dontpanicv.com;

    root /usr/share/nginx/html/preview;
    index index.html;

    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
