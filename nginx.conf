server {
    listen 80;
    server_name dontpanicv.com preview.dontpanicv.com;

    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content Security Policy
    # - default-src 'self': Only allow resources from same origin by default
    # - style-src 'self' 'unsafe-inline': Allow inline styles (used in index.html)
    # - img-src 'self' data: svg+: Allow images from same origin and data URIs (for inline SVG if needed, though mine is inline HTML)
    # - script-src 'self': Only allow scripts from same origin (no inline scripts)
    # - object-src 'none': Disable plugins
    # - base-uri 'self': Restrict <base> tag
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self';" always;

    # Disable directory listing
    autoindex off;

    # Only allow GET and HEAD methods
    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    # Deny access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Serve static files only
    location / {
        # Prevent path traversal by ensuring the URI resolves to a file or directory
        try_files $uri $uri/ =404;
    }

    # Explicitly allow expected extensions and deny others (optional, but requested "only host static html...")
    # However, strict allow-listing by extension can be brittle. 
    # The try_files above + mime.types (default in nginx) handles serving.
    # The CSP and Method restriction handles the "active" threats.
}
