# Serve static output for dontpanicv.com.

# Auto-language (best-effort):
# - If the site is behind Cloudflare, `CF-IPCountry: CZ` means the visitor IP is Czech Republic.
# - If there is no explicit `lang=` cookie, redirect first-time CZ visitors to `/cs/`.
map $cookie_lang $lang_cookie_set {
    default 1;
    "" 0;
}

map $http_cf_ipcountry $ip_is_cz {
    default 0;
    CZ 1;
}

map "$lang_cookie_set$ip_is_cz" $redirect_to_cs {
    default 0;
    "01" 1;
}

server {
    listen 80;
    server_name dontpanicv.com;

    root /usr/share/nginx/html/main;
    index index.html;

    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self';" always;

    autoindex off;

    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Root: serve the site entrypoint
    location = / {
        if ($redirect_to_cs = 1) {
            return 302 /cs/;
        }
        try_files /index.html =404;
    }

    # Convenience: redirect to Czech CV for CZ visitors (unless user forced a lang cookie)
    location = /cv {
        if ($redirect_to_cs = 1) {
            return 302 /cs/cv;
        }
        try_files $uri $uri/ =404;
    }

    # Other static files / folders
    location / {
        try_files $uri $uri/ =404;
    }
}

# preview.dontpanicv.com retired (no server block here)
