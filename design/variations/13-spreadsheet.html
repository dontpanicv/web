<!doctype html>
<!--
  13 · SPREADSHEET
  Signature interaction: the site is a workbook. Click or arrow-key around cells (the formula bar shows the full content),
  switch sheets with the tabs, press Enter / double-click a row (or click its title) to open a comfortable reading panel,
  and type real formulas into the formula bar.
  Easter eggs:
   1. =ANSWER()  → 42.  Also =SUM(stars) → 42 (41 + 1 + 0, honestly) and =6*9 → 42.
   2. =VLOOKUP("towel")  → finds the towel, wakes Terry the helper towel and unhides the hidden sheet.
   3. Hidden sheet DO_NOT_OPEN: click the faint "1 hidden" next to the tabs (or type =UNHIDE()).
   4. Circular reference: type a formula that points at the selected cell itself (e.g. select B2, type =B2).
   5. Error jokes: =1/0 → #DIV/0!, =Z99 → #REF!, any unknown function → #NAME?, =PANIC() → 0.
   6. Terry the towel: open the CV sheet, press the "?" button, or type =HELP(). "It looks like you're trying to hire a nerd."
  Deep links for review: #Projects, #Writing, #CV, #Contact, and #Writing:analyst to open the article panel.
-->

<style>

    #hid{font-size:0;padding:0 8px;opacity:.7}#hid::after{content:"+1";font-size:12px}

    #panel{width:100%;border-left:0}

    #terry{bottom:64px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

      if (fn === 'NOW' || fn === 'TODAY') return { v: new Date().toLocaleString('en-GB', fn === 'NOW' ? { dateStyle: 'medium', timeStyle: 'short' } : { dateStyle: 'medium' }), note: 'Local time. Deep Thought would have taken longer.' };
      if (fn === 'HELP') return { v: 'Terry is on it', terry: 'help' };
      if (fn === 'UNHIDE') return { v: 'DO_NOT_OPEN', unhide: 1 };
      if (fn === 'COUNT') { const n = { projects: PROJECTS.length, writing: POSTS.length, posts: POSTS.length, cv: 3, contact: 4, towels: 1 }[a]; return n == null ? { v: '#NAME?', err: 1, note: `I can count projects, writing, cv and contact. Not “${arg}”.` } : { v: n }; }
      if (fn === 'SUM') {
        if (a === 'stars') return { v: 42, note: '41 + 1 + 0. Coincidence is not a supported data type.' };
        if ((m = a.match(/^([a-z])(\d+):([a-z])(\d+)$/))) {
          let s = 0, n = 0; const mm = mapOf(cur);
          for (let col = m[1].charCodeAt(0); col <= m[3].charCodeAt(0); col++) for (let r = +m[2]; r <= +m[4]; r++) { const x = mm[String.fromCharCode(col - 32) + r]; if (x && typeof x.t === 'number') { s += x.t; n++; } }
          return { v: s, note: n ? `${n} numeric cell${n > 1 ? 's' : ''} in ${arg.toUpperCase()}.` : 'Nothing numeric in that range. Zero it is.' };
        }
        return { v: '#VALUE!', err: 1, note: 'SUM wants a range like D2:D5, or the word stars.' };
      }
      if (fn === 'VLOOKUP') {
        if (!a) return { v: '#N/A', err: 1, note: 'Look up what, exactly?' };
        if (a === 'towel') return { v: '1 towel', note: 'Found in DO_NOT_OPEN!A3. You always know where it is.', terry: 'towel', unhide: 1 };
        for (const s of VISIBLE) { const mm = mapOf(s); for (const k in mm) if (String(mm[k].t).toLowerCase().includes(a)) return { v: `${s}!${k}`, note: String(mm[k].t).slice(0, 110) }; }
        return { v: '#N/A', err: 1, note: `No “${arg}” anywhere. Have you looked under the towel?` };
      }
      return { v: '#NAME?', err: 1, note: `${fn}() is not a function here. Try =HELP().` };
    }
    if ((m = e.match(/^([A-Za-z])(\d{1,3})$/))) {
      const a = m[1].toUpperCase() + m[2];
      if (sel && a === sel.dataset.a) return { stop: 1, note: 'This cell depends on itself. So do most meetings.' };
      const x = mapOf(cur)[a];
      return x ? { v: typeof x.t === 'number' ? x.t : String(x.t).slice(0, 80) } : { v: '#REF!', err: 1, note: `${a} is empty. It may have moved to Bali in 2015.` };
    }
    if ((m = e.match(/^(-?\d+(?:\.\d+)?)\s*([+\-*\/x×])\s*(-?\d+(?:\.\d+)?)$/))) {
      const x = +m[1], y = +m[3], op = m[2];
      if (op === '/' && y === 0) return { v: '#DIV/0!', err: 1, note: 'Even Deep Thought declined this one.' };
      if ((op === '*' || op === 'x' || op === '×') && ((x === 6 && y === 9) || (x === 9 && y === 6))) return { v: 42, note: 'In base 13. Do not check.' };
      return { v: +(op === '+' ? x + y : op === '-' ? x - y : op === '/' ? x / y : x * y).toFixed(6) };
    }
    if (/^-?\d+(\.\d+)?$/.test(e)) return { v: +e };
    return { v: '#NAME?', err: 1, note: 'I do not know that one. Try =HELP().' };
  }
  function commit() {
    const src = fx.value.trim();
    if (!src.startsWith('=')) { if (src && src !== textOf(map[sel.dataset.a])) { say('Read-only.', 'The content is not editable. Formulas are welcome, though: start with ='); fx.value = textOf(map[sel.dataset.a]); autosize(); } return; }
    const res = calc(src);
    if (res.stop) return say('Circular reference.', res.note, true);
    let td = sel && !map[sel.dataset.a] && sel.classList.contains('e') ? sel : [...grid.querySelectorAll('tr.tail td[data-c="1"]')].find(x => !map[x.dataset.a]);
    if (!td) return say(String(res.v), res.note || '');
    const cell = { t: res.v, f: src, k: (typeof res.v === 'number' ? 'num ' : '') + (res.err ? 'err ' : '') + 'calc' };
    (extra[cur] || (extra[cur] = {}))[td.dataset.a] = cell;
    if (res.unhide && !hiddenShown) { hiddenShown = true; const a = td.dataset.a; render(); td = grid.querySelector(`td[data-a="${a}"]`); }
    else { map[td.dataset.a] = cell; td.className = cell.k; td.textContent = cell.t; td.dataset.label = src; }
    td.classList.add('flash'); select(td, !mobile());
    say(`${td.dataset.a} = ${res.v}`, res.note ? ' ' + res.note : '', res.err);
    status(`${src}  →  ${res.v}`);
    if (res.terry) terry(res.terry);
  }
  function toggleFns(on) {
    const pop = $('#fnpop'), btn = $('#fnbtn'); on = on ?? pop.hidden; pop.hidden = !on; btn.setAttribute('aria-expanded', on);
    if (on && !pop.firstChild) FNS.forEach(([f, d]) => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = `<code>${esc(f)}</code><span>${esc(d)}</span>`; b.onclick = () => { toggleFns(false); fx.value = f; autosize(); commit(); }; pop.append(b); });
    if (on) pop.firstChild.focus();
  }
  $('#fnbtn').addEventListener('click', () => toggleFns());

  /* ---------- events ---------- */
  grid.addEventListener('click', e => {
    const td = e.target.closest('td'); if (!td) return;
    const o = e.target.closest('[data-open]'), g = e.target.closest('[data-go]');
    select(td, false);
    if (g) return switchSheet(g.dataset.go);
    if (o && (o.tagName === 'BUTTON' || mobile())) openDoc(o.dataset.open, td);
  });
  grid.addEventListener('dblclick', e => { const tr = e.target.closest('tr[data-open]'); if (tr) openDoc(tr.dataset.open, e.target.closest('td')); });
  grid.addEventListener('focusin', e => { const td = e.target.closest('td'); if (td && td !== sel) select(td, false); });
  grid.addEventListener('keydown', e => {
    if (!sel || e.metaKey || e.ctrlKey || e.altKey) return;
    const r = +sel.dataset.r, c0 = +sel.dataset.c, s = +sel.dataset.s, k = e.key;
    let t;
    if (k === 'ArrowRight') { t = cellAt(r, c0 + s); colWish = c0 + s; }
    else if (k === 'ArrowLeft') { t = cellAt(r, c0 - 1); colWish = Math.max(0, c0 - 1); }
    else if (k === 'ArrowDown') t = cellAt(r + 1, colWish);
    else if (k === 'ArrowUp') t = cellAt(r - 1, colWish);
    else if (k === 'Enter') {
      if (e.target.closest('a,button')) return;
      const tr = sel.closest('tr'), g = sel.querySelector('[data-go]'), a = sel.querySelector('a');
      e.preventDefault();
      if (tr.dataset.open) openDoc(tr.dataset.open, sel); else if (g) switchSheet(g.dataset.go); else if (a) a.click(); else fx.focus();
      return;
    } else if (k.length === 1 && k !== ' ' && !e.target.closest('a,button')) { fx.focus(); fx.value = ''; return; }
    else return;
    e.preventDefault(); if (t) { const keep = colWish; select(t); if (k === 'ArrowDown' || k === 'ArrowUp') colWish = keep; else colWish = +t.dataset.c; }
  });
  fx.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { fx.value = textOf(map[sel.dataset.a]); autosize(); sel.focus({ preventScroll: true }); }
  });
  fx.addEventListener('input', autosize);
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-sheet]'); if (b) switchSheet(b.dataset.sheet); });
  $('#sort').addEventListener('click', e => { sortDir = sortDir === 1 ? -1 : sortDir === -1 ? 0 : 1; e.currentTarget.setAttribute('aria-pressed', sortDir !== 0); e.currentTarget.textContent = '★ Sort' + (sortDir === 1 ? ' ↓' : sortDir === -1 ? ' ↑' : ''); render(); status(sortDir ? 'Sorted by stars. Meiro abstains.' : 'Original order.'); });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#fnpop').hidden) return toggleFns(false);
    if ($('#terry').classList.contains('on')) return $('#terry').classList.remove('on');
    closePanel();
  });
  addEventListener('click', e => { if (!$('#fnpop').hidden && !e.target.closest('.tools')) toggleFns(false); });
  addEventListener('resize', moveRing);

  /* ---------- boot ---------- */
  console.assert(calc('=ANSWER()').v === 42 && calc('=SUM(stars)').v === 42 && calc('=6*9').v === 42 && calc('=2+2').v === 4 && calc('=1/0').v === '#DIV/0!' && calc('=NOPE()').err && calc('=VLOOKUP("towel")').unhide, 'formula self-check failed');
  const [h1, h2] = decodeURIComponent(location.hash.slice(1)).split(':');
  if (SHEETS[h1]) { if (h1 === 'DO_NOT_OPEN') hiddenShown = true; if (h1 === 'CV') switchSheet.cvSeen = 1; cur = h1; }
  render();
  if (h2 && DOCS[h2]) openDoc(h2, grid.querySelector(`tr[data-open="${h2}"] td`));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveRing);
})();
