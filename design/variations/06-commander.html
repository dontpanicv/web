<!doctype html>
<!--
  06-commander — a two-pane orthodox file manager for /home/v.
  SIGNATURE INTERACTION: browse V's home directory. Arrows move, Enter / F3 / double-click opens a full-screen reader,
    Tab switches panes, ← / Backspace goes up, typing goes to the command line. Mouse and touch work everywhere;
    on phones it is one pane with drill-down.
  EASTER EGGS
    1. F8 (Delete) on anything → confirm → "cannot remove". On `..` in /home/v or on `v` in /home: "device or resource busy".
    2. Hidden file `.towel` (Hitchhiker's nod): F2, Ctrl+H, Options → Show hidden files, or type `ls -a`.
    3. F10 (Quit) → "There is no escape." Keeps answering differently for a few tries. `exit` does the same.
    4. Command line: `42`, `sudo make me a sandwich`, `make me a sandwich`, `rm -rf /`, `vim`, `panic`, `towel`,
       `whoami`, `uptime`, `sudo <anything>`, `man v`.
    5. /home/v/.secrets/ — `answer.txt` (Deep Thought nod, 42 bytes) and `id_rsa` (nice try).
    6. /mnt/bender, /mnt/glados, /mnt/saturnin each carry a `motd`.
    7. F4 Edit, F6 Move, F7 Mkdir all refuse, each with its own reason.
    8. Open six files and Marvin comments in the hint line.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Panic, V! — /home/v</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0a14a0; --blue2:#070e78; --bk:#04062e; --cy:#35d6e0; --yl:#ffe95a; --wh:#fff; --gr:#c3caff; --dim:#8b96ea; --red:#b3122b;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bk);color:var(--gr);font:15px/1.45 var(--mono);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--yl);outline-offset:-2px}
body.scan::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(0,0,10,.1) 0 1px,transparent 1px 3px)}

#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto auto;background:var(--blue)}

/* menu bar */
.menubar{background:var(--cy);color:#001;display:flex;align-items:stretch;position:relative;z-index:30;white-space:nowrap}
.brand{background:#001;color:var(--yl);font-weight:700;padding:4px 12px;letter-spacing:.03em}
.menubar>button{padding:4px 14px}
.menubar>button:hover,.menubar>button[aria-expanded=true]{background:#001;color:var(--cy)}
.clock{margin-left:auto;padding:4px 12px}
.drop{position:absolute;top:100%;background:var(--cy);color:#001;border:4px double #001;min-width:250px;box-shadow:10px 10px 0 rgba(0,0,10,.5)}
.drop button{display:flex;justify-content:space-between;gap:28px;width:100%;padding:5px 12px}
.drop button:hover,.drop button:focus{background:#001;color:var(--cy);outline:0}
.drop kbd{font:inherit;opacity:.75}

/* panes */
.panes{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;padding:14px 8px 6px;animation:wipe .45s steps(14) both}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.pane{position:relative;border:4px double var(--gr);display:flex;flex-direction:column;min-width:0;min-height:0}
.pane.on{border-color:var(--wh)}
.ptitle{position:absolute;top:-13px;left:50%;transform:translateX(-50%);margin:0;padding:0 10px;font:inherit;background:var(--blue);color:var(--wh);white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.pane.on .ptitle{background:var(--cy);color:#001}
.cols,.list li{display:grid;grid-template-columns:minmax(0,1fr) 10ch 14ch}
.cols{color:var(--yl);text-align:center;border-bottom:1px solid var(--gr);padding-top:6px}
.cols span+span,.list li span+span{border-left:1px solid var(--gr)}
.list{flex:1;overflow:auto;margin:0;padding:0;list-style:none;outline:0;scrollbar-color:var(--cy) var(--blue2)}
.list li{cursor:default;user-select:none}
.list li span{padding:1px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .s,.list .t{text-align:right}
.list li.dir .n{color:var(--wh);font-weight:600}
.list li.hid .n{color:var(--dim)}
.list li[aria-selected=true]{background:var(--cy)}
.list li[aria-selected=true] span{color:#001;border-color:#001}
.pane:not(.on) .list li[aria-selected=true]{background:transparent;outline:1px solid var(--cy);outline-offset:-1px}
.pane:not(.on) .list li[aria-selected=true] span{color:var(--wh);border-color:var(--gr)}
.pfoot{border-top:1px solid var(--gr);padding:2px 8px;display:flex;justify-content:space-between;gap:16px;white-space:nowrap;overflow:hidden}
.pfoot button{color:var(--yl)}
.pfoot button:hover{background:var(--yl);color:#001}
.motd{display:none}

/* quick view + shared prose */
.qv{flex:1;overflow:auto;padding:16px 24px 26px;outline:0;scrollbar-color:var(--cy) var(--blue2)}
.prose{font:17px/1.62 var(--sans);color:#f1f2ff}
.prose>*{max-width:66ch}
.prose h1{font:700 26px/1.15 var(--mono);color:var(--yl);margin:.15em 0 .5em;text-shadow:2px 2px 0 rgba(0,0,10,.6)}
.prose h2{font:600 14px/1.3 var(--mono);color:var(--cy);text-transform:uppercase;letter-spacing:.1em;margin:1.7em 0 .45em}
.prose p{margin:0 0 .95em}
.prose a{color:var(--yl);text-underline-offset:3px}
.prose a:hover{background:var(--yl);color:#001;text-decoration:none}
.prose blockquote{margin:1.1em 0;padding:.15em 0 .15em 16px;border-left:4px double var(--cy);color:var(--wh);font-style:italic}
.prose code,.prose kbd{font:.86em var(--mono);background:rgba(0,0,10,.4);padding:.05em .35em;color:#fff}
.prose pre{font:14px/1.5 var(--mono);background:rgba(0,0,10,.45);border:1px solid var(--dim);padding:12px 14px;overflow:auto;color:#e7eaff}
.prose ul{padding-left:1.2em;margin:0 0 1em}
.prose li{margin:.25em 0}
.prose hr{border:0;border-top:4px double var(--dim);margin:2.4em 0;max-width:none}
.kicker{font:13px/1.4 var(--mono);color:var(--cy);text-transform:uppercase;letter-spacing:.1em;margin:0 0 .3em}
.meta{font:13px/1.5 var(--mono);color:var(--gr)}
.hero{display:flex;gap:20px;align-items:center;margin-bottom:.6em}
.hero svg{width:104px;height:auto;flex:none;color:var(--cy)}
.hero h1{font-size:clamp(26px,3.1vw,42px);margin:0 0 .2em}
.hero p{margin:0}
.dirlist{list-style:none;padding:0!important}
.dirlist li{display:grid;grid-template-columns:minmax(0,22ch) 1fr;gap:14px;border-bottom:1px dotted var(--dim);padding:.35em 0;margin:0}
.dirlist a{font:15px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard{font:15px/1.7 var(--mono);background:rgba(0,0,10,.4);border:1px solid var(--dim);padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere}

/* output, command line, f-keys, hint */
.out{background:var(--bk);padding:3px 10px 0;min-height:1.6em;max-height:4.6em;overflow:hidden;white-space:pre-wrap;color:var(--gr)}
.out b{color:var(--dim);font-weight:400}
.cmd{display:flex;gap:8px;align-items:center;background:var(--bk);padding:2px 10px 4px}
.cmd label{color:var(--wh);white-space:nowrap}
.cmd input{flex:1;min-width:0;font:inherit;color:var(--wh);background:none;border:0;outline:0;caret-color:var(--yl);caret-shape:block;padding:0}
.fbar{display:grid;grid-template-columns:repeat(10,1fr);background:var(--bk)}
.fbar button{display:flex;min-width:0}
.fbar b{font-weight:400;color:var(--wh);padding:3px 3px 3px 8px}
.fbar span{flex:1;background:var(--cy);color:#001;padding:3px 6px;white-space:nowrap;overflow:hidden}
.fbar button:hover span,.fbar button:focus-visible span{background:var(--yl)}
.hint{background:var(--bk);color:var(--dim);padding:9px 210px 13px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--yl);font-weight:400}

/* reader */
.reader{position:fixed;inset:0;z-index:50;background:var(--blue2);display:flex;flex-direction:column;animation:pop .16s steps(4) both}
@keyframes pop{from{clip-path:inset(46% 46%)}to{clip-path:inset(0)}}
.rbar{background:var(--cy);color:#001;display:flex;gap:18px;padding:4px 12px;white-space:nowrap}
.rbar .path{overflow:hidden;text-overflow:ellipsis}
.rbar .pct{margin-left:auto}
.rbody{flex:1;overflow:auto;outline:0;padding:clamp(24px,6vh,68px) 22px 90px;scrollbar-color:var(--cy) var(--blue2)}
.rbody article{max-width:66ch;margin:0 auto}
.rbody .prose{font-size:19px;line-height:1.72}
.rbody .prose h1{font-size:clamp(28px,4.2vw,40px)}
.rkeys{display:flex;background:var(--bk);padding-right:210px;padding-bottom:10px}
.rkeys button{display:flex}
.rkeys b{font-weight:400;color:var(--wh);padding:3px 3px 3px 8px}
.rkeys span{background:var(--cy);color:#001;padding:3px 10px;white-space:nowrap}
.rkeys button:hover span{background:var(--yl)}
.reader.paper{background:#f3eee0}
.paper .prose{color:#1c1b18}
.paper .prose h1{color:#0a14a0;text-shadow:none}
.paper .prose h2{color:#0b6e78}
.paper .prose a{color:#0a14a0}
.paper .prose a:hover{background:#0a14a0;color:#fff}
.paper .prose blockquote{color:#1c1b18;border-color:#0b6e78}
.paper .prose code,.paper .prose kbd{background:#e2dac4;color:#1c1b18}
.paper .prose pre,.paper .vcard{background:#e9e2cf;border-color:#b8ae90;color:#1c1b18}
.paper .kicker{color:#0b6e78}
.paper .meta{color:#55514a}
.paper .hero svg{color:#0a14a0}
.paper .prose hr,.paper .dirlist li{border-color:#b8ae90}

/* dialogs */
.dwrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(0,0,20,.4)}
.dlg{background:#c7ccdc;color:#001;padding:8px;max-width:min(560px,100%);box-shadow:12px 12px 0 rgba(0,0,10,.55);animation:pop .12s steps(3) both}
.dlg>div{border:4px double #001;padding:14px 22px 12px;position:relative}
.dlg h3{position:absolute;top:-13px;left:50%;transform:translateX(-50%);margin:0;padding:0 10px;font:inherit;background:#c7ccdc;white-space:nowrap}
.dlg .body{margin:6px 0 14px;text-align:center;line-height:1.6}
.dlg .body.left{text-align:left}
.dlg .btns{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.dlg .btns button{padding:1px 6px}
.dlg .btns button:focus,.dlg .btns button:hover{background:#001;color:var(--cy);outline:0}
.dlg.err{background:var(--red);color:#fff}
.dlg.err>div{border-color:#fff}
.dlg.err h3{background:var(--red)}
.dlg.err .btns button:focus,.dlg.err .btns button:hover{background:#fff;color:var(--red)}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:2px 18px;margin:0}
.dlg dt{font-weight:700}
.dlg dd{margin:0}
.bar{height:1.3em;background:#001;margin:10px 0 4px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--cy);transition:width .9s steps(18)}

@media (max-width:860px){
  body{font-size:14px}
  .brand span,.clock{display:none}
  .menubar>button{padding:6px 9px}
  .panes{grid-template-columns:1fr;padding:14px 6px 4px}
  #R{display:none}
  .cols,.list li{grid-template-columns:minmax(0,1fr) 11ch}
  .cols .t,.list .t{display:none}
  .list li span{padding:8px}
  .motd{display:block;font:17px/1.5 var(--sans);color:#f1f2ff;padding:12px 12px 10px;border-bottom:1px solid var(--gr)}
  .motd b{font:700 20px var(--mono);color:var(--yl);display:block;margin-bottom:2px}
  .motd em{color:var(--cy);font-style:normal}
  .fbar{grid-template-columns:repeat(5,1fr)}
  .fbar .x{display:none}
  .fbar span,.fbar b{padding-top:7px;padding-bottom:7px}
  .hint{padding-right:190px}
  .rkeys{flex-wrap:wrap;padding-right:0;padding-bottom:50px}
  .rkeys span,.rkeys b{padding-top:7px;padding-bottom:7px}
  .hero svg{width:72px}
  .dirlist li{grid-template-columns:1fr;gap:0}
}
@media (prefers-reduced-motion:reduce){
  .panes,.reader,.dlg{animation:none}
  .bar i{transition:none}
}
</style>
</head>

<p class="kicker">post · 2026-04-29</p>
<h1>Beyond the Tool-Calling Loop: How We Built an AI Analyst with Bash, a Mounted Filesystem, and a JSON Renderer</h1>
<p>Most AI features built today follow the same recipe: take the Vercel AI SDK, register a handful of tools, write a system prompt, and stream the result into a markdown component. It works. It is also where most teams stop — and where most AI products start to feel limited.</p>
<p>This article walks through the architecture we ended up with for the <strong>AI Analyst</strong> in Engage, and contrasts it with the more conventional <strong>Piper chatbot</strong> that lives next door in the same codebase. Both ship in the same product. They are wildly different inside.</p>
<p>We will start from the naive baseline, identify the two failure modes that pushed us off it (noisy tool results and metadata bloat), and then introduce the three ideas that replaced them: <strong>just-bash with an in-memory filesystem</strong>, a <strong>SQL execution layer that mounts results as files</strong>, and a <strong>JSON renderer with a predefined component manifest</strong>.</p>
<h2>1. The naive architecture: AI SDK + tools + markdown</h2>
<p>The Piper chatbot is the textbook implementation. The server side is essentially a single call:</p>
<pre>const stream = await streamText({
  model: google(CHAT_MODEL),
  system: buildSystemPrompt({ baseUrl, disabledFeatureIds }),
  tools: assistantTools,
  messages: modelMessages,
  stopWhen: stepCountIs(20),
});</pre>
<p>This works great for <em>operational</em> assistants — “create an audience”, “show me the last failed delivery”, “explain what this attribute does”. The conversation is short, each tool returns a small, well-shaped object, and the markdown is the answer.</p>
<p>An analyst is a different animal. Its tools return tables, not objects, and a model that politely pours fifty thousand rows of JSON into its own context has no room left to think.</p>
<p class="meta">Excerpt. <a href="/posts/ai-analyst-architecture/">Continue reading the full article →</a></p>`;

<h1>Stop Letting AI Agents Guess Where Code Goes</h1>
