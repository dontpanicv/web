<!doctype html>
<!--
  16-embedding-map — "the latent space of V": everything he does as a 2-D embedding scatter plot.
  SIGNATURE INTERACTION: hover / tap / focus a point to see its nearest neighbours with cosine scores (computed
    from real tag vectors); click to read it in the panel. Drag to pan, ⌘/Ctrl + scroll or pinch or +/− to zoom,
    N / P step through points from the keyboard. The search box "embeds" a query and flies to the nearest point.
    The same content is a normal readable page below the figure ("List view").
  EASTER EGGS
    1. Search `42`, `meaning of life`, `the answer` or `ultimate question` → a hidden point appears far outside
       every cluster and the camera flies to it (Deep Thought nod).
    2. The lonely outlier bottom-right is a towel. Its cosine similarity to everything is 0.00. Click it.
    3. Temperature slider at maximum (2.0) → the labels start hallucinating.
    4. Press "re-train" five times → mode collapse: every point becomes the same point, then it rolls back.
    5. Click the projection name in the figure caption → t-SNE → UMAP → PCA → vibes.
    6. Search `ignore previous instructions`, or `panic`.
-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Panic, V! — the latent space of V</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2ea; --panel:#fbf9f4; --ink:#15171c; --mut:#565a63; --line:#d9d4c5; --grid:#e6e1d3; --acc:#FFD400;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --top:58px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.65 var(--serif);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.px{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;background:var(--panel);border:2px solid var(--ink);padding:8px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.px:hover{background:var(--acc)}
.px:active{transform:translate(2px,2px);box-shadow:none}

/* header */
.top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--paper);border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand svg{width:30px;height:auto}
.brand b{font:700 15px/1 var(--mono);letter-spacing:.02em}
.brand span{font:400 12px/1 var(--mono);color:var(--mut)}
.search{flex:1;max-width:520px;display:flex;align-items:center;border:2px solid var(--ink);background:var(--panel);margin-left:auto}
.search label{font:500 12px/1 var(--mono);padding:0 10px;color:var(--mut);white-space:nowrap}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;padding:9px 10px 9px 0;font:400 14px/1.2 var(--mono)}
.search:focus-within{box-shadow:2px 2px 0 var(--ink);background:#fff}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) min(42vw,580px);height:calc(100dvh - var(--top));min-height:560px;border-bottom:2px solid var(--ink)}
.plot{position:relative;margin:0;display:flex;flex-direction:column;min-width:0;min-height:0}
.cvwrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y;outline-offset:-4px}
canvas.drag{cursor:grabbing}
.legend{position:absolute;left:14px;top:14px;right:150px;display:flex;flex-wrap:wrap;gap:4px}
.legend button{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.07em;background:rgba(251,249,244,.9);border:1px solid var(--line);padding:5px 8px 5px 6px;cursor:pointer;display:flex;gap:7px;align-items:center}
.legend button:hover,.legend button[aria-pressed=true]{border-color:var(--ink);background:#fff}
.legend i{width:9px;height:9px;background:var(--c);display:block}
.legend small{color:var(--mut);font-size:10px}
.zoom{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.zoom .px{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:15px}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font:400 12px/1.3 var(--mono)}
.tools label{display:flex;align-items:center;gap:8px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.tools output{color:var(--ink);min-width:3ch}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:18px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--ink)}
input[type=range]::-moz-range-track{height:4px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--acc);border:2px solid var(--ink);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--acc);border:2px solid var(--ink);border-radius:0}
#status{margin-left:auto;color:var(--ink);text-align:right;min-height:1.3em;flex:1;min-width:200px}
figcaption{padding:8px 14px 12px;border-top:1px solid var(--line);font:italic 14px/1.45 var(--serif);color:var(--mut)}
figcaption b{font-style:normal;color:var(--ink)}
figcaption button{font:inherit;background:none;border:0;border-bottom:1px dashed var(--mut);padding:0;cursor:pointer;color:var(--ink)}

/* reader panel */
.panel{background:var(--panel);border-left:2px solid var(--ink);overflow:auto;padding:30px 34px 90px;min-width:0;scroll-margin-top:var(--top)}
.chip{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px;color:var(--mut)}
.chip i{width:10px;height:10px;background:var(--c,var(--ink))}
.panel h2,.entry h3{font:600 30px/1.14 var(--serif);margin:0 0 .5em;letter-spacing:-.01em;text-wrap:balance}
.panel .back{float:right;margin:-6px 0 8px 12px}
.prose{max-width:66ch}
.prose p{margin:0 0 1em}
.prose h4{font:500 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:1.9em 0 .5em}
.prose a{color:var(--ink);text-decoration-thickness:2px;text-decoration-color:var(--acc);text-underline-offset:3px}
.prose a:hover{background:var(--acc)}
.prose ul{margin:0 0 1em;padding-left:1.1em}
.prose li{margin:.3em 0}
.prose blockquote{margin:1.2em 0;padding:.1em 0 .1em 18px;border-left:4px solid var(--acc);font-style:italic}
.prose code{font:.82em var(--mono);background:#ebe6d7;padding:.1em .35em}
.prose pre{font:13px/1.55 var(--mono);background:#16181d;color:#f0ede4;padding:14px 16px;overflow:auto;margin:0 0 1.1em}
.lead{font-size:21px;line-height:1.5}
.hero{display:flex;gap:18px;align-items:center;margin:0 0 18px}
.hero svg{width:84px;height:auto;flex:none}
.hero h2{font:700 clamp(26px,2.6vw,36px)/1.05 var(--mono);margin:0 0 6px;letter-spacing:-.02em}
.hero p{margin:0;font:400 13px/1.45 var(--mono);color:var(--mut)}
.nn{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.nn button{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;font:400 14px/1.3 var(--mono)}
.nn button:hover{background:var(--acc)}
.nn i{width:10px;height:10px;background:var(--c)}
.nn span{color:var(--mut)}
.coords{font:400 12px/1.5 var(--mono);color:var(--mut);margin-top:16px}

/* the plain page */
.page{max-width:1180px;margin:0 auto;padding:56px 24px 120px}
.page>header{max-width:66ch;margin-bottom:8px}
.page h2.sec{font:500 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;border-top:2px solid var(--ink);padding-top:12px;margin:64px 0 28px;display:flex;justify-content:space-between}
.page h2.sec span{color:var(--mut)}
.entry{display:grid;grid-template-columns:200px minmax(0,66ch);gap:8px 36px;margin:0 0 44px}
.entry aside{font:400 12px/1.6 var(--mono);color:var(--mut);padding-top:8px}
.entry aside .px{margin-top:10px;font-size:11px;padding:6px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0;padding:0;list-style:none}
.chips button{font:400 13px/1 var(--mono);background:var(--panel);border:1px solid var(--ink);padding:7px 9px;cursor:pointer;display:flex;gap:7px;align-items:center}
.chips button:hover{background:var(--acc)}
.chips i{width:8px;height:8px;background:var(--c)}

body.listonly .stage{display:none}

@media (max-width:900px){
  :root{--top:104px}
  .top{flex-wrap:wrap;height:var(--top);padding:8px 12px;gap:8px 10px;align-content:center}
  .brand span{display:none}
  .search{order:3;flex:1 1 100%;max-width:none;margin:0}
  #viewbtn{margin-left:auto}
  .stage{display:block;height:auto;min-height:0}
  .cvwrap{height:50vh;min-height:340px;flex:none}
  .legend{display:none}
  .zoom{right:8px;top:8px}
  #status{flex:1 1 100%;text-align:left;margin:0}
  .panel{border-left:0;border-top:2px solid var(--ink);padding:26px 18px 40px;overflow:visible}
  .page{padding:40px 18px 110px}
  .entry{grid-template-columns:1fr}
  .entry aside{padding:0;order:2}
  .panel h2,.entry h3{font-size:26px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<header class="top">

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

<p class="lead">Most AI features built today follow the same recipe: take the Vercel AI SDK, register a handful of tools, write a system prompt, and stream the result into a markdown component. It works. It is also where most teams stop — and where most AI products start to feel limited.</p>
<p>This article walks through the architecture we ended up with for the <strong>AI Analyst</strong> in Engage, and contrasts it with the more conventional <strong>Piper chatbot</strong> that lives next door in the same codebase. Both ship in the same product. They are wildly different inside.</p>
<p>We will start from the naive baseline, identify the two failure modes that pushed us off it (noisy tool results and metadata bloat), and then introduce the three ideas that replaced them: <strong>just-bash with an in-memory filesystem</strong>, a <strong>SQL execution layer that mounts results as files</strong>, and a <strong>JSON renderer with a predefined component manifest</strong>.</p>
<h4>1. The naive architecture: AI SDK + tools + markdown</h4>
<p>The Piper chatbot is the textbook implementation. The server side is essentially a single call:</p>
<pre>const stream = await streamText({
  model: google(CHAT_MODEL),
  system: buildSystemPrompt({ baseUrl, disabledFeatureIds }),
  tools: assistantTools,
  messages: modelMessages,
  stopWhen: stepCountIs(20),
});</pre>
<p>This works great for <em>operational</em> assistants — “create an audience”, “show me the last failed delivery”, “explain what this attribute does”. The conversation is short, each tool returns a small, well-shaped object, and the markdown is the answer.</p>
<p>An analyst is a different animal. Its tools return tables, not objects, and a model that politely pours fifty thousand rows of JSON into its own context has no room left to think.</p>
<p><a href="/posts/ai-analyst-architecture/">Continue reading the full article →</a></p>`;

  /* screen positions, with temperature jitter */
  const amp = temp * 5; SP = {};
  for (const p of PTS) { if (p.hidden) continue; SP[p.id] = [sx(p.x) + amp * Math.sin(t / 700 + p.ph), sy(p.y) + amp * Math.cos(t / 830 + p.ph * 1.7)]; }
  /* cluster hulls */
  ctx.font = '500 11px "JetBrains Mono", ui-monospace, monospace'; const hb = [];
  for (const k in CL) {
    const pts = PTS.filter(p => p.c === k && !(p.pull && p.pull[1] > .4)).map(p => SP[p.id]), c = [0, 0];
    pts.forEach(p => { c[0] += p[0] / pts.length; c[1] += p[1] / pts.length; });
    const pad = Math.max(26, Math.min(46, view.z * .1));
    const V = hullOf(pts).map(p => { const dx = p[0] - c[0], dy = p[1] - c[1], l = Math.hypot(dx, dy) || 1; return [p[0] + dx / l * pad, p[1] + dy / l * pad]; });

    ctx.closePath();
    const off = dim && dim !== k; ctx.globalAlpha = off ? .25 : 1;
    ctx.fillStyle = pattern(CL[k].col); ctx.fill();
    ctx.setLineDash([2, 4]); ctx.strokeStyle = CL[k].col; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
    const top = Math.min(...V.map(v => v[1])), name = CL[k].name.toUpperCase(), tw = ctx.measureText(name).width + 12;
    ctx.fillStyle = PAPER; ctx.fillRect(c[0] - tw / 2, top - 9, tw, 16); hb.push([c[0] - tw / 2, top - 9, tw, 16]);
    ctx.fillStyle = CL[k].col; ctx.textAlign = 'center'; ctx.fillText(name, c[0], top + 3);
    ctx.globalAlpha = 1;
  }
  /* neighbour links */
  const act = BY[hover] || BY[sel], near = new Map();
  if (act && SP[act.id]) {
    const a = SP[act.id]; ctx.font = '500 11px "JetBrains Mono", ui-monospace, monospace';
    for (const [q, s] of act.nn) { const b = SP[q.id]; if (!b) continue; near.set(q.id, s);
      ctx.strokeStyle = INK; ctx.lineWidth = 1 + s * 1.5; ctx.setLineDash([5, 4]); ctx.globalAlpha = .35 + s * .55; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }

  for (const [p, b, txt, sc, lw, w, forced] of paint.reverse()) {  // most important label painted last, on top
    if (p.id === sel) { ctx.fillStyle = INK; ctx.fillRect(b[0], b[1], b[2], b[3]); ctx.fillStyle = '#FFD400'; }
    else { ctx.fillStyle = 'rgba(245,242,234,.88)'; ctx.fillRect(b[0], b[1], b[2], b[3]); ctx.fillStyle = act && !forced ? '#8d8a80' : INK; }
    ctx.fillText(txt, b[0] + 3, b[1] + 9.5);
    if (sc) { ctx.fillStyle = INK; ctx.fillRect(b[0] + lw + 9, b[1], w - lw - 3, 18); ctx.fillStyle = '#FFD400'; ctx.fillText(sc, b[0] + lw + 13, b[1] + 9.5); }

/* ---------- interaction ---------- */
const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;

    if (drag.moved) { view.cx = drag.cx - dx / view.z; view.cy = drag.cy + dy / view.z; touched = true; vtween = null; need(); }

});
const endPtr = e => { ptrs.delete(e.pointerId); cv.classList.remove('drag'); if (drag && !drag.moved && e.type === 'pointerup') { const h = hit(...local(e)); if (h) select(h, W < 600); } if (!ptrs.size) drag = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);

cv.addEventListener('dblclick', e => zoomAt(...local(e), 1.6));
cv.addEventListener('wheel', e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); zoomAt(...local(e), Math.exp(-e.deltaY * .012)); }, {passive: false});
const clampZ = z => Math.max(fitZ * .5, Math.min(fitZ * 8, z));
function zoomAt(mx, my, f) { const wx = view.cx + (mx - W / 2) / view.z, wy = view.cy - (my - H / 2) / view.z, z = clampZ(view.z * f); view = {z, cx: wx - (mx - W / 2) / z, cy: wy + (my - H / 2) / z}; touched = true; vtween = null; need(); }

$('#zfit').onclick = () => { fly(fitView()); touched = false; setDim(null); };
cv.addEventListener('keydown', e => {

/* ---------- reader panel ---------- */
const kind = p => `<p class="chip" style="--c:${p.col}"><i></i>${TYPE[p.type]}${p.c ? ' · ' + CL[p.c].name : ''}${p.meta ? ' · ' + p.meta : ''}</p>`;
const INTRO = `
<div class="hero">${LOGO}<div><h2>Don't Panic, V!</h2><p>Vojtěch “V” Kurka · Head of R&amp;D &amp; Co-Founder at Meiro · Brno, Czechia</p></div></div>
<div class="prose">
<p class="lead">I write code no one wants to read, but everyone needs to have. Data whatever.</p>
<p>I like knowing how things work — from CPUs and protocols to databases and containers. Almost ten years of building a data platform in production taught me most of it. Now I spend that curiosity on AI: local models, agentic workflows, and getting it all into production for real customers.</p>
<p>If I can't explain it to someone else, I don't understand it yet. So here is everything, embedded and projected onto a plane.</p>
<h4>How to read the figure</h4>
<ul>
<li>Every square is something I built, wrote, did or care about. <strong>Solid</strong> squares are projects and work, <strong>hollow</strong> ones are writing, small ones are skills and places.</li>

<h4>Start somewhere</h4>
</div>
<ul class="nn">${['mycroft', 'golem', 'shadow', 'meiro', 'post-analyst', 'contact'].map(id => `<li><button data-id="${id}" style="--c:${BY[id].col}"><i></i>${BY[id].label}<span>${TYPE[BY[id].type]}</span></button></li>`).join('')}</ul>`;

document.addEventListener('click', e => {

/* ---------- search: "embedding" a query ---------- */
function search(raw) {
  const q = raw.trim().toLowerCase(); if (!q) return say('');
  if (/^(42|forty.?two)$|meaning of life|ultimate question|the answer|life,? the universe/.test(q)) {
    const p = BY.fortytwo; if (!revealed) { revealed = true; p.hidden = false; $('#nfig').textContent = 'n = ' + visible().length; }
    select('fortytwo', true); return say('nearest: “42” · cos 1.00 · distance from everything else: considerable');
  }
  if (/ignore (all )?(the )?previous/.test(q)) return say('Prompt injection embedded. It landed nowhere near “instructions I follow”.');
  if (/^(don'?t )?panic!?$/.test(q)) { select('dontpanic', true); return say("DON'T."); }

    const lab = (p.label + ' ' + p.title).toLowerCase(), body = p.text ??= Object.assign(document.createElement('div'), {innerHTML: p.html}).textContent.toLowerCase();
    let s = 0; for (const t of toks) { if (lab.includes(t)) s += 3; if ([...p.tagset].some(g => g.startsWith(t))) s += 2; if (body.includes(t)) s += 1; }
    if (s > bs) { bs = s; best = p; }

}

$('#page').innerHTML = `
