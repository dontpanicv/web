<!doctype html>
<!--
  01 · QUERY CONSOLE — "The site is a database."
  Signature interaction: the query bar. Type SQL (or click a suggestion / a table / a column in the schema browser)
  and a small interpreter runs it: SELECT cols FROM table [WHERE col = 'x' | LIKE '%x%' | > n] [ORDER BY col DESC] [LIMIT n],
  \dt, \d table, \?, EXPLAIN ANALYZE SELECT * FROM career, \reset. Arrow up/down = history, "/" focuses the bar.
  Easter eggs:
    1. SELECT answer FROM deep_thought;      -> a "7.5 million years" progress bar that resolves to 42
    2. DROP TABLE projects; (or DELETE / TRUNCATE / UPDATE / INSERT) -> permission denied, with a quip
    3. \q (or exit / quit)                    -> the session refuses to end
    4. SELECT * FROM towel;                   -> the towel is present
    5. SELECT 6*9;                            -> 42
    6. sudo anything                          -> reported to glados
    7. \dt+                                   -> reveals the hidden schema "improbable" (towel, deep_thought)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v=# — Don't Panic, V!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe4; --paper-2: #ebe4d3; --ink: #17150f; --ink-2: #514b3e; --rule: #d6cdb8;
    --acc: #ffd400; --side: #17150f; --side-text: #ede6d6; --side-muted: #a59e8c; --err: #9c2b12;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.6 var(--serif); display: grid; grid-template-columns: 292px minmax(0, 1fr); min-height: 100vh; }
  a { color: inherit; text-decoration-color: var(--acc); text-decoration-thickness: 3px; text-underline-offset: 3px; }
  a:hover { background: var(--acc); text-decoration-color: var(--ink); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  ::selection { background: var(--acc); color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ── schema browser ── */
  .side { background: var(--side); color: var(--side-text); font: 13px/1.5 var(--mono); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 20px 70px; scrollbar-width: thin; scrollbar-color: #3a362b transparent; }
  .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  .logo { width: 46px; height: 44px; flex: none; }
  .logo g { fill: var(--acc); }
  .brand b { font-size: 15px; letter-spacing: .02em; display: block; }
  .brand span { color: var(--side-muted); font-size: 11.5px; }
  .conn { color: var(--side-muted); font-size: 11.5px; margin: 14px 0 20px; padding: 9px 10px; border: 1px solid #36322a; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; background: var(--acc); flex: none; animation: pulse 2.4s steps(2) infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .side summary { list-style: none; cursor: pointer; color: var(--side-muted); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; margin-bottom: 10px; }
  .side summary::-webkit-details-marker { display: none; }
  .tbl { margin-bottom: 12px; }
  .tname { display: flex; width: 100%; justify-content: space-between; align-items: baseline; padding: 3px 6px; margin-left: -6px; font-weight: 700; font-size: 13.5px; }
  .tname::before { content: "▦"; color: var(--acc); margin-right: 8px; font-weight: 400; }
  .tname span:first-of-type { flex: 1; }
  .tname i { font-style: normal; color: var(--side-muted); font-weight: 400; font-size: 11.5px; }
  .tname:hover, .tname.on { background: var(--acc); color: var(--ink); }
  .tname:hover::before, .tname.on::before, .tname:hover i, .tname.on i { color: var(--ink); }
  .cols { list-style: none; margin: 2px 0 0 5px; padding: 0 0 0 14px; border-left: 1px solid #36322a; }
  .cols button { display: flex; width: 100%; justify-content: space-between; gap: 10px; padding: 1px 4px; color: #cfc8b7; }
  .cols button i { font-style: normal; color: #7f7868; }
  .cols button:hover { background: #2b281f; color: #fff; }
  .side footer { margin-top: 22px; color: var(--side-muted); font-size: 11.5px; line-height: 1.7; }

  /* ── query bar ── */
  main { min-width: 0; }
  .bar { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 2px solid var(--ink); padding: 14px clamp(16px, 4vw, 56px) 12px; }
  .bar form { display: flex; align-items: center; gap: 12px; border: 2px solid var(--ink); background: #fffdf7; padding: 0 0 0 14px; box-shadow: 5px 5px 0 var(--ink); }
  .bar form:focus-within { box-shadow: 5px 5px 0 var(--acc), 5px 5px 0 2px var(--ink); }
  .pr { font: 700 15px var(--mono); white-space: nowrap; }
  #q { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 500 16px/1 var(--mono); color: var(--ink); padding: 15px 0; caret-color: var(--ink); }
  #q::placeholder { color: #8d8676; }
  .run { background: var(--acc); font: 700 13px var(--mono); padding: 0 18px; align-self: stretch; border-left: 2px solid var(--ink); letter-spacing: .06em; }
  .run:hover { background: var(--ink); color: var(--acc); }
  .chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips span { font: 11.5px var(--mono); color: var(--ink-2); align-self: center; white-space: nowrap; }
  .chip { font: 12.5px var(--mono); white-space: nowrap; border: 1px solid var(--ink); padding: 4px 9px; background: var(--paper); }
  .chip:hover { background: var(--ink); color: var(--paper); }

  /* ── results ── */
  #log { padding: 8px clamp(16px, 4vw, 56px) 120px; max-width: 1180px; }
  .res { padding: 34px 0 30px; border-bottom: 1px dashed var(--rule); scroll-margin-top: 130px; }
  .res.new { animation: land .5s cubic-bezier(.2, .8, .2, 1); }
  .res.new .q code { animation: flash 1.4s ease-out; }
  @keyframes land { from { opacity: 0; transform: translateY(-14px); } }
  @keyframes flash { from { background: var(--acc); } }
  .q { font: 14px/1.5 var(--mono); display: flex; gap: 10px; margin-bottom: 20px; color: var(--ink-2); }
  .q code { font: inherit; color: var(--ink); overflow-wrap: anywhere; }
  .q code b { font-weight: 700; }
  .meta { font: 12.5px/1.6 var(--mono); color: var(--ink-2); margin-top: 20px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .meta b { color: var(--ink); font-weight: 500; }
  .null { font: italic 400 .85em var(--mono); color: #857e6d; }

  /* v: expanded record */
  .rec-h { font: 12.5px var(--mono); color: var(--ink-2); display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
  .rec-h::after { content: ""; flex: 1; border-top: 1px solid var(--ink); }
  .rec { display: grid; grid-template-columns: 96px minmax(0, 1fr); margin: 0; }
  .rec dt { font: 12.5px/1.5 var(--mono); color: var(--ink-2); padding: 15px 0 0; border-top: 1px solid var(--rule); }
  .rec dd { margin: 0; padding: 10px 0 12px 20px; border-top: 1px solid var(--rule); border-left: 1px solid var(--ink); max-width: 68ch; }
  .rec dt:first-of-type, .rec dd:first-of-type { border-top: 0; }
  .rec .name { font-size: clamp(42px, 6.4vw, 88px); line-height: .98; font-weight: 500; letter-spacing: -.025em; padding-top: 18px; padding-bottom: 20px; max-width: none; }
  .rec .name mark { background: var(--acc); padding: 0 .08em; color: inherit; }
  .rec .big { font-size: clamp(21px, 2.1vw, 26px); line-height: 1.38; }

  /* projects: rows as cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 20px; }
  .card { border: 2px solid var(--ink); background: #fffdf7; padding: 20px 22px 18px; position: relative; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--acc), 6px 6px 0 2px var(--ink); }
  .res.new .card, .res.new .post, .res.new .job, .res.new tbody tr { animation: row .45s both cubic-bezier(.2, .8, .2, 1); animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
  @keyframes row { from { opacity: 0; transform: translateX(-10px); } }
  .rown { font: 11.5px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .12em; }
  .card h3 { font-size: 40px; line-height: 1.05; font-weight: 500; letter-spacing: -.02em; margin: 6px 0 8px; }
  .card h3 a { text-decoration: none; }
  .card .tag { font-size: 20px; line-height: 1.35; margin: 0 0 10px; font-style: italic; padding-right: 70px; }
  .card .about { margin: 0 0 16px; font-size: 17.5px; color: #2b281f; }
  .emb { position: absolute; top: 18px; right: 18px; width: 56px; height: 56px; }
  .kv { display: flex; flex-wrap: wrap; margin: auto 0 0; border-top: 1px solid var(--ink); font: 12.5px var(--mono); }
  .kv div { padding: 8px 16px 0 0; margin-right: 16px; border-right: 1px solid var(--rule); }
  .kv div:last-child { border: 0; }
  .kv dt { color: var(--ink-2); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  .kv dd { margin: 0; font-weight: 500; font-size: 14px; }
  .go { font: 13px var(--mono); margin-top: 12px; align-self: flex-start; }

  /* posts */
  .posts, .jobs, .links { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .post { display: grid; grid-template-columns: 118px minmax(0, 1fr) auto; gap: 6px 22px; padding: 18px 0 20px; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .post .date, .job .yr { font: 13px var(--mono); color: var(--ink-2); }
  .post h3 { margin: 0 0 6px; font-size: clamp(23px, 2.2vw, 29px); line-height: 1.2; font-weight: 500; letter-spacing: -.01em; }
  .post h3 button { text-decoration: underline; text-decoration-color: var(--acc); text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .post h3 button:hover { background: var(--acc); }
  .post p { margin: 0; max-width: 66ch; color: #2b281f; }
  .pill { font: 11.5px var(--mono); padding: 3px 8px; border: 1px solid var(--ink); white-space: nowrap; }
  .pill.published { background: var(--ink); color: var(--paper); }
  .pill.idea { border-style: dashed; }

  /* jobs */
  .job { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 4px 22px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .job h3 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 500; }
  .job h3 span { font: 13px var(--mono); color: var(--ink-2); margin-left: 8px; white-space: nowrap; }
  .job p { margin: 4px 0 0; max-width: 66ch; }

  /* contact */
  .links li { border-bottom: 1px solid var(--rule); }
  .links a { display: grid; grid-template-columns: 118px minmax(0, 1fr) auto; gap: 22px; padding: 14px 6px 14px 0; text-decoration: none; align-items: baseline; font-size: clamp(22px, 2.4vw, 30px); overflow-wrap: anywhere; }
  .links a span { font: 13px var(--mono); color: var(--ink-2); }
  .links a i { font: normal 15px var(--mono); }

  /* notes */
  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 0 44px; border-top: 2px solid var(--ink); }
  .quotes figure { margin: 0; padding: 20px 0 22px; border-bottom: 1px solid var(--rule); }
  .quotes blockquote { margin: 0; font-size: 24px; line-height: 1.32; font-style: italic; }
  .quotes figcaption { font: 12px var(--mono); color: var(--ink-2); margin-top: 10px; }

  /* generic result table */
  .tw { overflow-x: auto; border: 2px solid var(--ink); background: #fffdf7; }
  table { border-collapse: collapse; width: 100%; font-size: 17px; }
  th { font: 700 12px var(--mono); text-transform: lowercase; text-align: left; padding: 9px 14px; border-bottom: 2px solid var(--ink); background: var(--paper-2); white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; max-width: 60ch; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); font-size: 14.5px; text-align: right; }
  .cmd { font: 14px var(--mono); border-bottom: 3px solid var(--acc); }
  .cmd:hover { background: var(--acc); }

  /* messages */
  .msg { font: 15px/1.7 var(--mono); border-left: 5px solid var(--ink); padding: 10px 16px; background: var(--paper-2); max-width: 78ch; overflow-wrap: anywhere; }
  .msg.err { border-color: var(--err); }
  .msg.err b { color: var(--err); }
  .msg p { margin: 0; }

  /* EXPLAIN */
  .plan { font: 14px/1.5 var(--mono); }
  .node { position: relative; border: 2px solid var(--ink); background: #fffdf7; padding: 12px 16px 13px; max-width: 760px; }
  .node b { background: var(--acc); padding: 0 5px; }
  .node .cost { color: var(--ink-2); font-size: 12.5px; }
  .node p { font: 17.5px/1.5 var(--serif); margin: 6px 0 0; }
  .node .t { display: block; height: 6px; margin-top: 10px; background: var(--paper-2); }
  .node .t i { display: block; height: 100%; width: var(--w); background: var(--ink); transform-origin: left; }
  .res.new .node .t i { animation: grow .9s both cubic-bezier(.2, .8, .2, 1); animation-delay: calc(var(--i, 0) * 120ms + 300ms); }
  @keyframes grow { from { transform: scaleX(0); } }
  .kids { margin: 0 0 0 26px; padding: 14px 0 0 26px; border-left: 2px solid var(--ink); display: grid; gap: 14px; }
  .kids > .branch { position: relative; }
  .kids > .branch::before { content: ""; position: absolute; left: -26px; top: 22px; width: 24px; border-top: 2px solid var(--ink); }
  .kids > .branch::after { content: "→"; position: absolute; left: -15px; top: 11px; font: 13px var(--mono); background: var(--paper); line-height: 1.5; }

  /* deep thought */
  .dt { max-width: 640px; font: 14px/1.6 var(--mono); }
  .dt .track { height: 26px; border: 2px solid var(--ink); background: repeating-conic-gradient(var(--paper-2) 0 25%, transparent 0 50%) 0 0 / 8px 8px; margin: 10px 0; }
  .dt .fill { height: 100%; width: 0; background: var(--ink); transition: width .12s linear; }
  .dt .ans { font: 500 clamp(120px, 20vw, 220px)/.9 var(--serif); letter-spacing: -.04em; margin: 18px 0 6px; }
  .dt .ans mark { background: var(--acc); color: inherit; padding: 0 .06em; }

  /* reading view */
  .read { max-width: 66ch; }
  .read .back { font: 13px var(--mono); border-bottom: 3px solid var(--acc); }
  .read .back:hover { background: var(--acc); }
  .read h2 { font-size: clamp(34px, 4vw, 50px); line-height: 1.08; font-weight: 500; letter-spacing: -.02em; margin: 22px 0 14px; text-wrap: balance; }
  .read .by { font: 13px var(--mono); color: var(--ink-2); padding-bottom: 18px; border-bottom: 2px solid var(--ink); margin: 0 0 26px; }
  .read p { font-size: 20px; line-height: 1.65; margin: 0 0 1.05em; }
  .read .by + p::first-letter { float: left; font-size: 4.3em; line-height: .82; padding: .06em .08em 0 0; font-weight: 500; }
  .read h3 { font-size: 27px; line-height: 1.2; font-weight: 600; margin: 1.6em 0 .5em; }
  .read pre { font: 14px/1.6 var(--mono); background: var(--side); color: var(--side-text); padding: 18px 20px; overflow-x: auto; margin: 0 0 1.5em; border-left: 6px solid var(--acc); }
  .read code { font-family: var(--mono); font-size: .82em; background: var(--paper-2); padding: 1px 5px; }
  .read pre code { background: none; padding: 0; font-size: 1em; }
  .read .more { font-size: 20px; border-top: 2px solid var(--ink); padding-top: 18px; }

  @media (max-width: 860px) {
    body { display: block; }
    .side { position: static; height: auto; padding: 16px 16px 14px; }
    .conn { margin: 12px 0; }
    .side details[open] summary { margin-bottom: 10px; }
    .side summary { margin: 0; }
    .side summary::after { content: " ＋"; color: var(--acc); }
    .side details[open] summary::after { content: " －"; }
    .side footer { display: none; }
    .bar { padding: 10px 12px; }
    .bar form { box-shadow: 3px 3px 0 var(--ink); padding-left: 10px; gap: 8px; }
    .run { padding: 0 12px; }
    #log { padding-bottom: 100px; }
    .res { scroll-margin-top: 118px; padding: 26px 0 24px; }
    .rec { grid-template-columns: 1fr; }
    .rec dt { padding: 12px 0 0; }
    .rec dd { border-left: 0; padding: 2px 0 12px; border-top: 0; }
    .rec dt:first-of-type { border-top: 0; }
    .post { grid-template-columns: 1fr; }
    .post .pill { justify-self: start; }
    .job, .links a { grid-template-columns: 1fr; gap: 2px; }
    .links a i { display: none; }
    .card h3 { font-size: 34px; }
    .kids { margin-left: 8px; padding-left: 18px; }
    .kids > .branch::before { left: -18px; width: 16px; }
    .kids > .branch::after { display: none; }
    .read p { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

    <p>Most AI features built today follow the same recipe: take the Vercel AI SDK, register a handful of tools, write a system prompt, and stream the result into a markdown component. It works. It is also where most teams stop — and where most AI products start to feel limited.</p>
    <p>This article walks through the architecture we ended up with for the <strong>AI Analyst</strong> in Engage, and contrasts it with the more conventional <strong>Piper chatbot</strong> that lives next door in the same codebase. Both ship in the same product. They are wildly different inside.</p>
    <h3>Problem one: tool results that flood the context</h3>
    <p>The first wall you hit is large tool outputs. Imagine a tool that runs a SQL query against the warehouse:</p>
    <pre><code>const run_query = tool({
  description: 'Run a SQL query against the warehouse.',
  inputSchema: z.object({ sql: z.string() }),
  execute: async ({ sql }) =&gt; {
    const { columns, rows } = await warehouse.execute(sql);
    return { columns, rows }; // &lt;-- 50,000 rows of JSON
  },
});</code></pre>
    <p>Whatever the tool returns goes straight into the model's context as the tool result message. A query that returns 50k rows is now 50k rows of JSON sitting in the conversation, on every subsequent turn, paid for in tokens, and pushing earlier reasoning out of the window.</p>
    <p>You can paginate. You can truncate. You can summarize. All of these are coping mechanisms — they either lose information or force the model to make decisions about data it cannot see.</p>
    <p>The fundamental problem is that <strong>tool results are a terrible place to put data</strong>. Tool results are great for facts the model needs to reason about next. They are awful for bulk data the model needs to slice, group, count, and chart.</p>
    <p class="more">The second wall is metadata bloat from inventory tools. What replaced the loop is three ideas: <code>just-bash</code> with an in-memory filesystem, a SQL execution layer that mounts results as files, and a JSON renderer with a predefined component manifest. <a href="https://dontpanicv.com/posts/ai-analyst-architecture/">Read the whole article →</a></p>`;

      <div><h3>${esc(r.role)} <span>@ ${esc(r.company)} · ${esc(r.place)}</span></h3><p>${esc(r.note)}</p></div></li>`).join('')}</ol>`,
    contact: rows => `<ul class="links">${rows.map(r => `<li><a href="${esc(r.url)}"><span>${esc(r.channel)}</span>${esc(r.handle)}<i>→</i></a></li>`).join('')}</ul>`,
    notes: rows => `<div class="quotes">${rows.map(r => `<figure><blockquote>${esc(r.quote)}</blockquote><figcaption>topic = '${esc(r.topic)}'</figcaption></figure>`).join('')}</div>`,
  };
  const table = (cols, rows, raw) => `<div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
    rows.map((r, i) => `<tr style="--i:${i}">${cols.map(c => `<td class="${typeof r[c] === 'number' ? 'num' : ''}">${raw ? r[c] : val(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const msg = (html, err) => `<div class="msg${err ? ' err' : ''}">${html}</div>`;
  const error = (text, hint) => ({ html: msg(`<p><b>ERROR:</b> ${text}</p>${hint ? `<p>HINT: ${hint}</p>` : ''}`, true) });
  const cmd = (q, label) => `<button class="cmd" data-q="${esc(q)}">${esc(label || q)}</button>`;
  const rowsLabel = n => `<b>(${n} row${n === 1 ? '' : 's'})</b>`;

  const reading = r => `<article class="read"><button class="back" data-q="${DEFAULT_Q.posts}">← back to posts</button>
    <h2>${esc(r.title)}</h2><p class="by">V. Kurka · ${val(r.published)} · body: text, ${r.body.replace(/<[^>]+>/g, '').split(/\s+/).length} words in this excerpt</p>${r.body}</article>`;

  const PLAN = `<div class="plan"><div class="node" style="--i:0"><b>Nested Loop</b> <span class="cost">(cost=0.42..∞ rows=1 width=wide) (actual time=2015..now)</span>
      <p>Join Filter: curiosity = production. One row comes out: a person who has to know how the whole thing works.</p><span class="t"><i style="--w:100%"></i></span></div>
    <div class="kids">
      <div class="branch"><div class="node" style="--i:1"><b>Index Scan</b> using curiosity_idx on systems <span class="cost">(loops=many)</span>
        <p>CPUs, operating systems, languages, databases, containers, proxies, protocols. “Some of that I picked up out of curiosity, the rest by debugging production.”</p><span class="t"><i style="--w:38%"></i></span></div></div>
      <div class="branch"><div class="node" style="--i:2"><b>Seq Scan</b> on vut_fit <span class="cost">(Filter: faculty = 'information technology')</span>
        <p>Brno University of Technology.</p><span class="t"><i style="--w:14%"></i></span></div></div>
      <div class="branch"><div class="node" style="--i:3"><b>Hash Join</b> on keboola <span class="cost">(2015..2018) (Hash Cond: role = 'Head Nerd')</span>
        <p>Solutions Architect, partly from Bali. Data integrations end to end, messy edge cases included.</p><span class="t"><i style="--w:27%"></i></span></div></div>
      <div class="branch"><div class="node" style="--i:4"><b>Merge Append</b> on meiro <span class="cost">(2018..now) (Sort Key: CTO → Head of R&amp;D)</span>
        <p>Co-founded the company. Customer data infrastructure, identity resolution, real-time pipelines — and the edge cases of running a CDP for enterprise customers.</p><span class="t"><i style="--w:74%"></i></span></div>
        <div class="kids"><div class="branch"><div class="node" style="--i:5"><b>Gather</b> <span class="cost">(Workers Launched: 3)</span>
          <p>Parallel workers: ${cmd("SELECT * FROM projects WHERE kind = 'open source';")} Mycroft, Golem, Shadow. Agents with real hands, on machines you own.</p><span class="t"><i style="--w:46%"></i></span></div></div></div></div>
    </div></div>`;

  /* ── interpreter ── */
  const SELECT = /^select\s+(.+?)\s+from\s+([a-z_]+)(?:\s+where\s+([a-z_]+)\s*(=|!=|<>|>=|<=|>|<|i?like)\s*'?([^']*?)'?)?(?:\s+order\s+by\s+([a-z_]+)(?:\s+(asc|desc))?(?:\s+nulls\s+(?:first|last))?)?(?:\s+limit\s+(\d+))?$/i;
  const cmp = (a, op, b) => {
    if (a == null) return false;
    if (/like/.test(op)) return new RegExp('^' + b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.') + '$', 'i').test(a);
    const [x, y] = typeof a === 'number' ? [a, Number(b)] : [String(a).toLowerCase(), b.toLowerCase()];
    return { '=': x === y, '!=': x !== y, '<>': x !== y, '>': x > y, '<': x < y, '>=': x >= y, '<=': x <= y }[op];
  };
  function select(sql) {
    const m = sql.match(SELECT);
    if (!m) return null;
    const [, colsRaw, tRaw, wcol, op, wval, ocol, odir, limit] = m;
    const tname = ALIAS[tRaw.toLowerCase()] || tRaw.toLowerCase(), t = DB[tname];
    if (!t) return error(`relation "${esc(tRaw)}" does not exist`, `list the tables with ${cmd('\\dt')}`);
    const nocol = c => error(`column "${esc(c)}" does not exist`, `see the columns with ${cmd('\\d ' + tname)}`);
    for (const c of [wcol, ocol]) if (c && !(c.toLowerCase() in t.cols)) return nocol(c);
    let rows = t.rows.slice();
    if (wcol) rows = rows.filter(r => cmp(r[wcol.toLowerCase()], op.toLowerCase(), wval));
    if (ocol) { const k = ocol.toLowerCase(), d = /desc/i.test(odir || '') ? -1 : 1;   // NULLS LAST either way: friendlier than Postgres
      rows.sort((a, b) => a[k] == null ? 1 : b[k] == null ? -1 : (a[k] > b[k] ? d : a[k] < b[k] ? -d : 0)); }
    if (limit) rows = rows.slice(0, +limit);
    const cl = colsRaw.toLowerCase().replace(/\s+/g, '');
    if (cl === 'count(*)') return { html: table(['count'], [{ count: rows.length }]), n: 1 };
    if (tname === 'deep_thought') return { deep: true };
    if (cl === '*') return { html: R[tname] ? (rows.length ? R[tname](rows) : table(Object.keys(t.cols), [])) : table(Object.keys(t.cols), rows), n: rows.length, table: tname };
    const cols = cl.split(',');
    for (const c of cols) if (!(c in t.cols)) return nocol(c);
    if (tname === 'posts' && cols.includes('body')) {
      if (!rows.length) return { html: table(cols, []), n: 0 };
      return rows[0].body ? { html: reading(rows[0]), n: 1, note: 'toast: the body was too long for one page, so it got typeset' }
        : { html: msg(`<p>title = ${esc(rows[0].title)}</p><p>body = ${NULL}</p><p>NOTICE: ${rows[0].status === 'published' ? `the full text lives at <a href="https://dontpanicv.com/posts/${esc(rows[0].slug)}/">/posts/${esc(rows[0].slug)}/</a>` : 'still in the drawer. It will be written when it is understood.'}</p>`), n: 1 };
    }
    return { html: table(cols, rows), n: rows.length };
  }

  const NOTES = ['planner used curiosity_idx', 'no tables were harmed', 'cost estimated in coffees', 'served from a warm cache', 'sequential scan; the table is small and so is the ego'];
  let noteI = 0;
  function exec(input) {
    const raw = input.trim(), sql = raw.replace(/;+\s*$/, '').replace(/\s+/g, ' '), low = sql.toLowerCase();
    if (!sql) return null;
    if (low === '\\dt' || low === '\\dt+' || low === 'show tables') {
      const plus = low === '\\dt+';
      const rows = Object.entries(DB).filter(([, t]) => plus || !t.hidden).map(([n, t]) => ({ schema: t.hidden ? 'improbable' : 'public', name: cmd(DEFAULT_Q[n] || `SELECT * FROM ${n};`, n), rows: t.rows.length, description: esc(t.desc) }));
      return { html: table(['schema', 'name', 'rows', 'description'], rows, true), n: rows.length, note: plus ? 'you found the improbable schema' : 'there may be more: \\dt+' };
    }
    let m;
    if ((m = low.match(/^\\d\+? ([a-z_]+)$/))) {
      const n = ALIAS[m[1]] || m[1], t = DB[n];
      if (!t) return error(`relation "${esc(m[1])}" does not exist`, `list the tables with ${cmd('\\dt')}`);
      const rows = Object.entries(t.cols).map(([c, ty]) => ({ column: cmd(`SELECT ${c} FROM ${n};`, c), type: ty, nullable: c === 'stars' || c === 'published' || c === 'until' || c === 'body' ? 'yes' : 'not null' }));
      return { html: table(['column', 'type', 'nullable'], rows, true), n: rows.length, note: `Table "public.${n}"` };
    }
    if (low === '\\?' || low === 'help' || low === '\\h') {
      const rows = [['SELECT * FROM projects ORDER BY stars DESC;', 'what is being built'], ['SELECT * FROM posts;', 'writing; click a title to read'], ['SELECT * FROM v;', 'the person'],
        ['SELECT * FROM jobs;', 'career so far'], ['SELECT * FROM contact;', 'how to reach V'], ['SELECT * FROM notes;', 'short takes'],
        ["SELECT name, stars FROM projects WHERE lang = 'Swift';", 'columns, WHERE, ORDER BY and LIMIT work'], ['EXPLAIN ANALYZE SELECT * FROM career;', 'the query plan of a career'],
        ['\\dt', 'list tables'], ['\\d projects', 'describe a table'], ['\\reset', 'restore the session'], ['\\q', 'quit (see how that goes)']]
        .map(([c, d]) => ({ statement: cmd(c), does: d }));
      return { html: table(['statement', 'does'], rows, true), note: 'everything here is clickable' };
    }
    if (low === '\\reset' || low === 'clear' || low === '\\clear') return { reset: true };
    if (/^(\\q|exit|quit|:q!?)$/.test(low)) return { html: msg(`<p><b>FATAL:</b> could not disconnect: curiosity still holds a lock on this session</p><p>DETAIL: Process 42 waits for ExclusiveLock on relation "attention".</p><p>HINT: Closing the tab works. Probably.</p>`, true) };
    if (/^sudo\b/.test(low)) return { html: msg(`<p>visitor is not in the sudoers file. This incident will be reported to <b>glados</b>.</p>`, true) };
    if ((m = low.match(/^(drop|truncate|delete|update|insert|alter)\b.*?\b(?:table|from|into)?\s*([a-z_]+)?/))) {
      const t = (low.match(/(?:table|from|into|update)\s+(?:if exists\s+)?([a-z_]+)/) || [])[1] || 'everything';
      const quip = { drop: 'These took years. The DROP would take four milliseconds. No.', truncate: 'Bold. Still no.', delete: 'Rows here are append-only, like regrets.', update: 'History is immutable. So is this table.', insert: `To add a row to contact, ${cmd('SELECT * FROM contact;')} and send an email instead.`, alter: 'The schema migrates itself, slowly, over decades.' }[m[1]];
      return { html: msg(`<p><b>ERROR:</b> permission denied for table ${esc(t)}</p><p>DETAIL: role "visitor" is read-only.</p><p>HINT: ${quip}</p>`, true) };
    }
    if (/^explain\b/.test(low)) {
      if (!/\b(career|jobs|v)\b/.test(low)) return error('this planner only explains careers', `try ${cmd('EXPLAIN ANALYZE SELECT * FROM career;')}`);
      return { html: PLAN, raw: '<b>Planning Time:</b> about ten years · <b>Execution Time:</b> still running' };
    }
    if ((m = low.match(/^select ([\d\s*+x×]+)$/))) {
      const e = m[1].replace(/\s/g, '');
      if (/^6[*x×]9$/.test(e)) return { html: table(['?column?'], [{ '?column?': 42 }]), n: 1, note: 'correct in base 13, and that is the story we are sticking to' };
      if (/^\d+$/.test(e)) return { html: table(['?column?'], [{ '?column?': +e }]), n: 1, note: e === '42' ? 'that is the answer. The question is still being computed' : 'a constant. Thrilling' };
      return error('arithmetic is left as an exercise for the reader', `the one supported product is ${cmd('SELECT 6*9;')}`);
    }
    if (/^select (now|current_timestamp)(\(\))?$/.test(low)) return { html: table(['now'], [{ now: new Date().toISOString().replace('T', ' ').slice(0, 19) + '+00' }]), n: 1 };
    if (/^(select version\(\)|show server_version)$/.test(low)) return { html: table(['version'], [{ version: 'V 42.0 (mostly harmless) on brno-cz, compiled by curiosity, 64-bit' }]), n: 1 };
    const r = select(sql);
    if (r) return r;
    return error(`syntax error at or near "${esc(sql.split(' ')[0].slice(0, 24))}"`, `this console speaks about ten statements. ${cmd('\\?')} lists them`);
  }

  /* ── console plumbing ── */
  const log = $('#log'), inp = $('#q');
  const hl = s => esc(s).replace(/\b(select|from|where|order by|desc|asc|nulls last|limit|explain|analyze|drop|table|like|and)\b/gi, '<b>$1</b>');
  const time = () => (Math.random() * 0.9 + 0.042).toFixed(3);
  function block(q, r, fresh) {
    const s = document.createElement('section');
    s.className = 'res' + (fresh ? ' new' : '');
    const meta = r.raw || [r.n != null && rowsLabel(r.n), r.html && !r.raw && `Time: ${time()} ms`, r.note || (r.n != null && NOTES[noteI++ % NOTES.length])].filter(Boolean).join(' · ');
    s.innerHTML = `<header class="q"><span class="pr">v=#</span><code>${hl(q)}</code></header><div class="out">${r.html || ''}</div>${meta ? `<footer class="meta">${meta}</footer>` : ''}`;
    return s;
  }
  function deepThought(s) {
    const out = s.querySelector('.out');
    out.innerHTML = `<div class="dt"><div class="lbl">Deep Thought is computing…</div><div class="track"><div class="fill"></div></div><div class="eta"></div></div>`;
    const fill = out.querySelector('.fill'), eta = out.querySelector('.eta'), total = reduced ? 1 : 60;
    let i = 0;
    const done = () => { out.innerHTML = `<div class="dt"><div class="ans"><mark>42</mark></div><p>question = ${NULL}</p></div><footer class="meta">${rowsLabel(1)} · Time: 7,500,000 years · NOTICE: you are not going to like it</footer>`; };
    const tick = () => { i++; fill.style.width = (i / total * 100) + '%'; eta.textContent = `estimated time remaining: ${(7.5 * (1 - i / total)).toFixed(2)} million years`; i >= total ? setTimeout(done, reduced ? 0 : 350) : setTimeout(tick, 55); };
    tick();
  }
  function session(queries) {
    log.innerHTML = '';
    for (const q of queries) log.append(block(q, exec(q), false));
  }
  const INITIAL = [DEFAULT_Q.v, DEFAULT_Q.projects, DEFAULT_Q.posts, DEFAULT_Q.notes, DEFAULT_Q.jobs, DEFAULT_Q.contact];
  const hist = []; let hi = 0;
  function run(q) {
    const r = exec(q);
    if (!r) return;
    hist.push(q); hi = hist.length;
    inp.value = '';
    if (r.reset) { session(INITIAL); scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); return; }
    const s = block(q, r, true);
    log.prepend(s);
    if (r.deep) deepThought(s);
    document.querySelectorAll('.tname').forEach(b => b.classList.toggle('on', b.dataset.t === r.table));
    s.scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' });
  }
  let typing;
  function typeAndRun(q) {
    clearInterval(typing);
    if (reduced) return run(q);
    let i = 0;
    typing = setInterval(() => { i += 2; inp.value = q.slice(0, i); if (i >= q.length) { clearInterval(typing); run(q); } }, 14);
  }

  $('#f').addEventListener('submit', e => { e.preventDefault(); clearInterval(typing); run(inp.value); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && hist.length) { e.preventDefault(); hi = Math.max(0, hi - 1); inp.value = hist[hi]; }
    if (e.key === 'ArrowDown' && hist.length) { e.preventDefault(); hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ''; }
  });
  document.addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) { e.preventDefault(); typeAndRun(b.dataset.q); } });
  document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== inp) { e.preventDefault(); inp.focus(); } });

  /* schema tree */
  $('#tree').innerHTML = Object.entries(DB).filter(([, t]) => !t.hidden).map(([n, t]) => `<div class="tbl">
    <button class="tname" data-t="${n}" data-q="${DEFAULT_Q[n]}"><span>${n}</span><i>${t.rows.length} row${t.rows.length === 1 ? '' : 's'}</i></button>
    <ul class="cols">${Object.entries(t.cols).map(([c, ty]) => `<li><button data-q="SELECT ${c} FROM ${n};">${c}<i>${ty}</i></button></li>`).join('')}</ul></div>`).join('');
  if (innerWidth < 860) $('#schema').open = false;

  session(INITIAL);
  /* shareable queries: ?q=SELECT%20*%20FROM%20notes */
  const shared = new URLSearchParams(location.search).get('q');
  if (shared) run(shared);

  /* self-check: the interpreter does what the chips promise */
  console.assert(exec('select name from projects where stars > 0').n === 2, 'WHERE on numbers');
  console.assert(exec("SELECT * FROM posts WHERE status = 'published' ORDER BY published DESC LIMIT 1;").n === 1, 'LIMIT');
  console.assert(exec('select * from career').table === 'jobs', 'alias');
  console.assert(/permission denied/.test(exec('DROP TABLE projects;').html), 'read-only');
  console.assert(/does not exist/.test(exec('select * from nope').html), 'unknown relation');
})();
</script>
