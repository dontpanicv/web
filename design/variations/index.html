<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Panic, V! — 20 design variations</title>
<style>
  :root { --bg:#f4f2ec; --ink:#141414; --muted:#6b6b66; --line:#d9d6cc; --card:#fff; --accent:#FFD400; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --ink:#f1efe8; --muted:#9a988f; --line:#2c2c2a; --card:#1b1b1a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width:1500px; margin:0 auto; padding:40px 24px 8px; }
  h1 { font-size:clamp(28px,4vw,48px); line-height:1.05; margin:0 0 8px; letter-spacing:-.02em; }
  h1 mark { background:var(--accent); color:#111; padding:0 .15em; }
  header p { margin:0; color:var(--muted); max-width:70ch; }
  main { max-width:1500px; margin:0 auto; padding:24px; display:grid; gap:24px; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); }
  body.sheet main { grid-template-columns:1fr 1fr; max-width:none; gap:20px; padding:20px; }
  body.sheet header { display:none; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; color:inherit; text-decoration:none; transition:transform .15s, box-shadow .15s; }
  a.card:hover, a.card:focus-visible { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.15); outline:2px solid var(--accent); }
  a.card img { display:block; width:100%; aspect-ratio:16/10; object-fit:cover; object-position:top; border-bottom:1px solid var(--line); background:#ddd; }
  .meta { padding:12px 14px 14px; }
  .meta b { font:600 13px/1 ui-monospace, Menlo, monospace; background:var(--accent); color:#111; padding:3px 6px; border-radius:4px; margin-right:8px; }
  .meta h2 { display:inline; font-size:18px; margin:0; }
  .meta p { margin:6px 0 0; color:var(--muted); font-size:15px; line-height:1.4; }
  .meta .try { color:var(--ink); font-size:14px; }
  body.sheet .meta h2 { font-size:26px; } body.sheet .meta b { font-size:20px; } body.sheet .meta p { font-size:20px; } body.sheet .try { display:none; }
  @media (prefers-reduced-motion: reduce) { a.card { transition:none; } }
</style>
</head>
<body>
<header>
  <h1><mark>Don't Panic, V!</mark> — 20 design variations</h1>
  <p>Each one is a working page with real content, a signature interaction and hidden Easter eggs. Open one and use the pill in the bottom-right corner to flip through. Each file starts with a comment listing its Easter eggs.</p>
</header>
<main id="grid"></main>
<script>
const V = [
  ["01-query-console","Query Console","The site is a database. Type SQL, get typeset results.","Try: SELECT answer FROM deep_thought · DROP TABLE projects · \\q"],
  ["02-dither-monolith","Dither Monolith","Greyscale plus one yellow accent; every graphic dithered live.","Try: move the light · press D · type 42"],
  ["03-the-guide","The Guide","A Guide device: wry entries, phosphor line art.","Try: Improbability Drive · search towel · Babel fish"],
  ["04-pipeline","Pipeline","Events flow through V; your own clicks enter the pipe.","Try: scroll fast · open the dead-letter queue · type towel"],
  ["05-schema-erd","Schema","The homepage is an ER diagram with draggable tables.","Try: drag a table · type \\d+ · double-click a column type"],
  ["06-commander","Commander","A two-pane blue file manager over /home/v.","Try: F8 · F10 · sudo make me a sandwich"],
  ["07-agent-trace","Agent Trace","An agent run whose tool results are the content.","Try: temperature to 2.0 · prompt “ignore previous instructions”"],
  ["08-decision-tree","Decision Tree","A decision model routes you to a leaf.","Try: grow a random forest · click max_depth four times"],
  ["09-pixel-quest","Pixel Quest","An 8-bit overworld above readable RPG panels.","Try: arrow keys · Konami code · find the chest"],
  ["10-greenbar","Greenbar","Mainframe printout on green-bar paper, printed line by line.","Try: tear a page · punch 42 into the card · click the salary"],
  ["11-datasheet","Datasheet","V as a component datasheet: VK-1, R&D grade.","Try: hover the pins · coffee slider · click pin 10"],
  ["12-daily-panic","The Daily Panic","A broadsheet with live-dithered pictures.","Try: Stop the presses! · solve the puzzle · type towel"],
  ["13-spreadsheet","Spreadsheet","A workbook with a working formula bar.","Try: =ANSWER() · =VLOOKUP(\"towel\") · the hidden sheet"],
  ["14-git-log","Git Log","Life and work as a commit graph.","Try: blame · git push --force · bisect"],
  ["15-observability","Observability","V in production: a paper dashboard.","Try: Trigger incident · click towel.status three times"],
  ["16-embedding-map","Embedding Map","The latent space of V as a scatter map.","Try: search 42 · temperature · re-train five times"],
  ["17-big-thumb","Big Thumb","Brutalist poster with kinetic type.","Try: the PANIC button · scroll up fast · type towel"],
  ["18-one-bit-desktop","One-Bit Desktop","A 1-bit desktop OS with draggable windows.","Try: panic.app · the Trash · Dither Lab"],
  ["19-notebook","Notebook","v.ipynb as a lab journal with runnable cells.","Try: Run all · print(6 * 9) · import antigravity"],
  ["20-rfc","RFC 4242","A plain-text standards memo with ASCII diagrams.","Try: step the handshake · click 418 · plain / rendered"],
];
const sheet = new URLSearchParams(location.search).get("sheet");
if (sheet) document.body.classList.add("sheet");
const items = sheet === "a" ? V.slice(0, 10) : sheet === "b" ? V.slice(10) : V;
document.getElementById("grid").innerHTML = items.map(([f, name, what, hint]) =>
  `<a class="card" href="${f}.html"><img loading="lazy" src="../shots/${f}.png" alt="Screenshot of ${name}"><div class="meta"><b>${f.slice(0, 2)}</b><h2>${name}</h2><p>${what}</p><p class="try">${hint}</p></div></a>`).join("");
</script>
</body>
</html>
